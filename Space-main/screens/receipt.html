<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UberX × SpaceX | Receipt</title>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <div class="brand-card">
        <a href="booking.html" class="icon-button">←</a>
        <div>
          <p class="eyebrow">Receipt</p>
          <h1>Recibo</h1>
        </div>
      </div>
      <nav class="page-nav">
        <a href="home.html" class="nav-link">Home</a>
        <a href="travel.html" class="nav-link">Travel</a>
        <a href="payment-methods.html" class="nav-link">Pagos</a>
        <a href="receipt.html" class="nav-link is-active">Recibo</a>
        <a href="settings.html" class="nav-link">Settings</a>
      </nav>
    </header>

    <main class="page-content">
      <section class="panel-card panel-receipt">
        <div class="receipt-body">
          <div class="receipt-amount">$859.50</div>
          <p class="receipt-meta">15th Oct 2024 · 08:15 AM</p>
          <div class="receipt-section">
            <strong>Flight Details</strong>
            <div class="receipt-row"><span>JFK</span><span>10:30 AM</span></div>
            <div class="receipt-row"><span>LAX</span><span>01:45 PM</span></div>
          </div>
          <div class="receipt-section">
            <div class="receipt-row"><span>Flight Number</span><span>AN123</span></div>
            <div class="receipt-row"><span>Seat</span><span>24A</span></div>
            <div class="receipt-row"><span>Fare</span><span>$780.00</span></div>
            <div class="receipt-row"><span>Taxes & Fees</span><span>$79.50</span></div>
            <div class="receipt-row total"><span>Total</span><span>$859.50</span></div>
          </div>
          <div class="receipt-tags">
            <span>Payment Method: Amex 5678</span>
            <span class="tag">Travel</span>
          </div>
        </div>
        <div class="receipt-actions">
          <button class="button button-secondary">Share</button>
          <button class="button button-secondary">Download</button>
          <button class="button button-secondary">Categorize</button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
